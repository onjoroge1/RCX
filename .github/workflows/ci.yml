name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Build-time placeholders only. CI verification in this job must not make
      # network calls to a production database or provider.
      DATABASE_URL: postgresql://rcx:rcx@127.0.0.1:5432/rcx
      AUTH_SECRET: ci-only-auth-secret-not-for-production
      ENCRYPTION_KEY: 1111111111111111111111111111111111111111111111111111111111111111
      AUTH_URL: http://localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Enforce tenant scoping contract
        run: pnpm check:scoping

      - name: Forbid operational mock data
        run: pnpm check:no-mocks

      - name: Safety tests
        run: pnpm test:safety

      - name: Production build
        run: pnpm build
